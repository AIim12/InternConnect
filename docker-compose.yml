version: '3.8'

services:
  # FalkorDB - Graph Database for skill matching
  falkordb:
    image: falkordb/falkordb:latest
    container_name: intern_connect_falkordb
    environment:
      # Security settings
      FALKORDB_PASSWORD: ${FALKORDB_PASSWORD:-secure_password_change_me}
    ports:
      - "6379:6379"
    volumes:
      - falkordb_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internconnect_network
    restart: unless-stopped
    # Security: run as non-root
    user: "1000:1000"

  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: intern_connect_backend
    environment:
      # JWT & Security
      JWT_SECRET: ${JWT_SECRET:-change_this_to_random_secret_in_production}
      JWT_ALGORITHM: "HS256"
      # FalkorDB connection
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: 6379
      FALKORDB_PASSWORD: ${FALKORDB_PASSWORD:-secure_password_change_me}
      # Environment
      ENV: ${ENV:-development}
    ports:
      - "8000:8000"
    depends_on:
      falkordb:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/__pycache__
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - internconnect_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: intern_connect_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - internconnect_network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Optional: Nginx reverse proxy for HTTPS in production
  nginx:
    image: nginx:latest
    container_name: intern_connect_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - internconnect_network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - NGINX_HOST=${NGINX_HOST:-localhost}
      - NGINX_PORT=${NGINX_PORT:-80}

volumes:
  falkordb_data:

networks:
  internconnect_network:
    driver: bridge
